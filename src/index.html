<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      // Fix for extensions/sandboxes attempting to overwrite window.fetch when Window prototype defines a getter only
      try {
        let _activeFetch = window.fetch ? window.fetch.bind(window) : null;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _activeFetch;
          },
          set(val) {
            _activeFetch = val;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Safe ignore
      }
    </script>
